version: 2
updates:
  # Mismo criterio que hwe-core. Payload y Next se suben JUNTOS: el peer de Payload
  # exige un rango de Next, y subir uno solo rompe la instalación. Estas PR avisan
  # de vulnerabilidades; no se mergean sin pasar antes por la puerta de seguridad
  # (pnpm audit y las migraciones sobre una copia de la BD).
  #
  # Los grupos solo recogen menores y parches. Un major no entra en ningún grupo
  # y llega en su propia PR, para decidirlo por separado (y no hay `ignore`).
  # El orden importa: una dependencia va al primer grupo que la contiene.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10
    groups:
      payload:
        patterns:
          - payload
          - '@payloadcms/*'
        update-types:
          - minor
          - patch
      next:
        patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
